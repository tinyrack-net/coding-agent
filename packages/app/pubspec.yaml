name: coding_agent_app
description: "Flutter client for the coding agent daemon."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  agent_protocol:
    path: ../protocol
  daemon_lifecycle:
    path: ../daemon_lifecycle
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  web_socket_channel: ^3.0.0
  uuid: ^4.5.0
  flutter_markdown_plus: ^1.0.3
  xterm: ^4.0.0
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/tray_icon.ico
    - assets/tray/tray_icon.png
