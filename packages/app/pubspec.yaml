name: coding_agent_app
description: "Flutter client for the coding agent daemon."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  agent_protocol:
    path: ../protocol
  tinyrack_relay:
    path: ../relay
  daemon_lifecycle:
    path: ../daemon_lifecycle
  agent_daemon:
    path: ../daemon
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  web_socket_channel: ^3.0.0
  uuid: ^4.5.0
  flutter_markdown_plus: ^1.0.3
  xterm: ^4.0.0
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  win32_registry: ^3.0.3
  local_notifier: ^0.1.6
  fluent_ui: ^4.16.0
  url_launcher: ^6.3.2
  desktop_drop: ^0.7.1
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  pasteboard: ^0.5.0
  image: ^4.9.1
  flutter_svg: ^2.3.0
  web: ^1.1.1
  flutter_localizations:
    sdk: flutter
  flutter_timezone: 5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/tray_icon.ico
    - assets/tray/tray_icon.png
