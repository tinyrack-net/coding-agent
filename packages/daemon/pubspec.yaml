name: agent_daemon
description: Headless daemon that runs coding agent sessions and serves the WebSocket API.
version: 0.1.0
publish_to: none
resolution: workspace

executables:
  coding-agent: coding_agent

environment:
  sdk: ^3.12.0

dependencies:
  agent_protocol:
    path: ../protocol
  bcrypt: ^1.2.0
  crypto: ^3.0.7
  daemon_lifecycle:
    path: ../daemon_lifecycle
  dart_ipc: ^2.0.0
  tinyrack_relay:
    path: ../relay
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0
  path: ^1.9.0
  qr: ^4.0.0
  uuid: ^4.5.0
  unorm_dart: ^0.3.2
  win32: ^6.3.0
  ffi: ^2.2.0
  http: ^1.2.0
  http_parser: ^4.1.2
  glob: ^2.1.2
  timezone: ^0.11.1
  xterm: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  async: ^2.13.0
  fake_async: ^1.3.3
  stream_channel: ^2.1.0
